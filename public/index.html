<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design × Tech Events</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fonts are self-hosted (no requests to Google); see public/fonts/. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="page" class="page">
      <div class="main-col">
        <header class="masthead">
          <a class="wordmark" href="/" aria-label="Design × Tech Events home">Design <span>×</span> Tech Events</a>
          <form id="location-form" class="headline" autocomplete="off">
            <label for="location-input">What's on near</label>
            <div class="location-field">
              <input id="location-input" name="location" type="text" spellcheck="false" />
              <button type="submit" class="btn btn-primary">Gather events</button>
            </div>
          </form>
          <p id="status" class="status" aria-live="polite"></p>
        </header>

        <section class="toolbar" aria-label="Filters">
          <div class="segmented" role="radiogroup" aria-label="Category" id="category-filter">
            <button type="button" role="radio" data-value="all" aria-checked="true">All</button>
            <button type="button" role="radio" data-value="design" aria-checked="false">Design</button>
            <button type="button" role="radio" data-value="tech" aria-checked="false">Tech</button>
          </div>

          <div class="search-field">
            <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="7" cy="7" r="4.5" />
              <path d="m10.5 10.5 3 3" />
            </svg>
            <input id="search" class="search" type="search" placeholder="Search titles, venues, hosts…"
              aria-label="Search events" />
            <button type="button" class="search-clear" id="search-clear" aria-label="Clear search" hidden>
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3.5 3.5 5 5m0-5-5 5" /></svg>
            </button>
          </div>

          <select id="window-filter" aria-label="Date range">
            <option value="7">Next 7 days</option>
            <option value="14">Next 2 weeks</option>
            <option value="31" selected>Next month</option>
            <option value="92">Next 3 months</option>
            <option value="0">Any time</option>
          </select>

          <select id="radius-filter" aria-label="Distance">
            <option value="5">Within 5 km</option>
            <option value="10">Within 10 km</option>
            <option value="25" selected>Within 25 km</option>
            <option value="50">Within 50 km</option>
            <option value="0">Any distance</option>
          </select>

          <label class="toggle"><input type="checkbox" id="online-filter" /> Include online</label>
        </section>

        <main id="list" class="list"></main>

        <footer class="credits">
          <p class="made-by">
            Made with <span class="heart" role="img" aria-label="love">♥</span> by
            <a href="https://marton-design.com/" target="_blank" rel="noopener">marton-design</a>
          </p>
          <p>Event data from Luma, Meetup and Eventbrite. Not affiliated with or endorsed by them.</p>
          <p>
            Location search ©
            <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>
          </p>
          <p>No tracking. Your location and picks are saved only in your browser.</p>
        </footer>
      </div>

      <aside id="picks" class="picks" aria-labelledby="picks-title" hidden>
        <div class="picks-head">
          <h2 id="picks-title">Your picks <span id="picks-count" class="count"></span></h2>
          <button type="button" class="icon-btn picks-toggle" id="picks-toggle" aria-expanded="false"
            aria-controls="picks-body" aria-label="Show picks">▴</button>
        </div>
        <div id="picks-body" class="picks-body">
          <div class="picks-actions">
            <button type="button" class="btn btn-sm" id="copy-links">Copy all links</button>
            <button type="button" class="btn btn-sm" id="clear-picks">Clear</button>
          </div>
          <ol id="picks-list" class="picks-list"></ol>
        </div>
      </aside>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <template id="calendar-menu-template">
      <div class="menu" role="menu">
        <a role="menuitem" data-cal="google" target="_blank" rel="noopener">Google Calendar</a>
        <a role="menuitem" data-cal="outlook" target="_blank" rel="noopener">Outlook.com</a>
        <a role="menuitem" data-cal="office" target="_blank" rel="noopener">Outlook (Microsoft 365)</a>
        <button type="button" role="menuitem" data-cal="ics">Apple / other (.ics)</button>
      </div>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
